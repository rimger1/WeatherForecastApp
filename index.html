<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeatherForecastApp</title>
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <h1><i class="bi bi-thermometer-sun text-danger-emphasis"></i>&nbsp;&nbsp;Weather Forecast App&nbsp;&nbsp;<i class="bi bi-thermometer-snow text-primary-emphasis"></i></h1>
            <h3>2026.</h3>
            <div class="themeSwitch">
                <i class="bi bi-sun-fill" id="lightModeBtn"></i>
                <i class="bi bi-moon-fill hide" id="darkModeBtn"></i>
            </div>
        </header>

        <!-- Navbar -->
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">Menu:</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">

                    <ul class="navbar-nav" id="basemenu">
                        <li class="nav-item">
                        <a class="nav-link" href="#" onclick="navigate('users/home')">Home</a>
                        </li>
                        <li class="nav-item">
                        <a class="nav-link" href="#" onclick="navigate('users/login')">Login</a>
                        </li>
                        <li class="nav-item">
                        <a class="nav-link" href='#' onclick="navigate('users/register')">Registration</a>
                        </li>
                    </ul> 

                    <ul class="navbar-nav" id="usermenu">
                        <!-- user -->
                        <li class="nav-item">
                        <a class="nav-link" href="#" onclick="navigate('users/steps')">My steps</a>
                        </li>
                        <li class="nav-item">
                        <a class="nav-link" href="#"  onclick="navigate('users/profile')">My profile</a>
                        </li>
                        <li class="nav-item">
                        <a class="nav-link" href="#" onclick="logout()">Logout</a>
                    </ul>

                    <ul class="navbar-nav" id="adminmenu">
                        <!-- admin -->
                        <li class="nav-item">
                        <a class="nav-link" href="#" onclick="navigate('admin/dashboard')">Dashboard</a>
                        </li>
                        <li class="nav-item">
                        <a class="nav-link" href="#" onclick="navigate('admin/users')">Manage Users</a>
                        </li>

                        <!-- logout -->
                        <li class="nav-item">
                        <a class="nav-link" href="#" onclick="logout()">Logout</a>
                    </ul>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <main id="content">
        </main>

        <!-- Footer -->
        <footer>
            <p>Bajai SZC Türr István Technikum - 13.A szoftverfejlesztő - <i>Készítette: Rimóczi Gergő</i></p>
        </footer>
    </div>

    <!-- Controllers -->
    <script src="controllers/mesageCtrl.js"></script>
    <script src="controllers/weatherCtrl.js"></script>
    <script src="controllers/userCtrl.js"></script>
    <script src="controllers/adminCtrl.js"></script>

    <!-- JS assets -->
    <script src="assets/js/bootstrap.min.js"></script>
    <script src="assets/js/moment-with-locales.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
